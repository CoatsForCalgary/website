            1YAPwIgqH8nsGYvnFmj_PZ_SPJchbKpGt annex
            1cwcoGMNZgBqsiq3MZzNXFNA50qFBzTRM property-law
            1-lWB_ek0987NVKg_BR5x3MO4M0QFatyj crestview
            1-A687AOn3vesPhaOghMNVRTlya-ckIf4 brewsmith
            1Pek3y2CmtQqokMrR5VvWq-iU1LyG1HO7 cables-lace
            1QR_x5eINSsIqdUreQ-7Z5peN2RgUdB4g creb
            15irlRKoy4diJ-TnxOjV1CQTL3LrSy69t westmount
            1hiofq8z7nprJ7T67VDKnMwD8kejFwU9M werklund
            1Q9-hCgjI9sesIkkDbtuiapKoy4yhYNf8 parkland
            1cA87UAKQRebY03vkSumSSsZq3EmHGDBx rally-pointe
            1MCSrYzpc6eh2scKe66palKZHaemfevCI vive
            1awg3w0DTtb66vaPvJDn27tCqthyCBqmT douglas-family-chiro
          LIST
          cat > /tmp/proc.py <<'PY'
          import io, subprocess, urllib.request
          from PIL import Image
          Image.MAX_IMAGE_PIXELS = None
          bad = []
          PRECROP = {"vitality-wellness": (0, 0, 0.5, 1), "mercedes-benz-downtown": (0, 0, 0.8, 1)}
          RECOLOR = {"the-station": (78, 69, 66)}
          for line in open('/tmp/list.txt'):
              line = line.strip()
              if not line: continue
              fid, name = line.split()
              try:
                  data = urllib.request.urlopen(f"https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t").read()
                  raw = f"/tmp/raw/{name}"
                  open(raw, "wb").write(data)
                  head = data[:16]
                  if head.startswith(b"%PDF") or head.startswith(b"%!PS") or head.startswith(b"\xc5\xd0\xd3\xc6"):
                      subprocess.run(["gs","-q","-dSAFER","-dBATCH","-dNOPAUSE","-dEPSCrop","-dFirstPage=1","-dLastPage=1","-sDEVICE=pngalpha","-r300",f"-sOutputFile={raw}.png",raw], check=True)
                      im = Image.open(raw + ".png")
                  elif b"<svg" in data[:4000] or b"<?xml" in data[:100]:
                      subprocess.run(["rsvg-convert","-w","1600","-o",raw + ".png",raw], check=True)
                      im = Image.open(raw + ".png")
                  else:
                      im = Image.open(io.BytesIO(data))
                  im.load(); im = im.convert("RGBA")
                  im.thumbnail((2400, 2400), Image.LANCZOS)
                  if name in PRECROP:
                      a, b2, c, d = PRECROP[name]; W, H = im.size
                      im = im.crop((int(a*W), int(b2*H), int(c*W), int(d*H)))
                  if name in RECOLOR:
                      solid = Image.new("RGBA", im.size, RECOLOR[name] + (255,)); solid.putalpha(im.getchannel("A")); im = solid
                  W, H = im.size
                  px = im.load()
                  mask = Image.new("L", (W, H), 0); mp = mask.load()
                  for yy in range(H):
                      for xx in range(W):
                          r, g, b, a = px[xx, yy]
                          if a > 20 and not (r > 238 and g > 238 and b > 238): mp[xx, yy] = 255
                  l, t, r, b = mask.getbbox() or (0, 0, W, H)
                  p = int(max(r - l, b - t) * 0.03)
                  im = im.crop((max(0, l - p), max(0, t - p), min(W, r + p), min(H, b + p)))
                  im.thumbnail((400, 200), Image.LANCZOS)
                  im.save(f"images/locations/{name}.png", optimize=True)
                  print("OK", name, im.size)
              except Exception as e:
                  bad.append(name); print("FAILED", name, repr(e))
          print("Failed:", bad)
          PY
          python3 /tmp/proc.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/locations
          git commit -m "Add the drop-off location logos (from the Drive folder)" || echo "nothing new"
          git push
