name: Pull drop-off location logos from Drive
on: workflow_dispatch
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript librsvg2-bin && pip install pillow
      - name: Download, convert, trim and shrink
        run: |
          mkdir -p images/locations /tmp/raw
          cat > /tmp/list.txt <<'LIST'
            1CdQUP_8CkPXPtDsv3z6Zd216AypQTs4A anita-ip
            1BiOvAMz_DacR_i2JZ4bOXfk4MGRO1cif world-bier-haus
            1ehyBSFbOCTqKzId0OqyLCQMHrLMOKt4_ mortgage-connection
            1hVcTFkCTgFlc3A15SOarVYzXiq6Z_5IV new-brighton
            1kK698Miet_Ls4TuiARc3SY6l8AwHzjIq village-brewery
            1vdqy_U-AWgKP3uNZRNglpcSImq6cxnlL vitality-wellness
            1rqkLJrUrJoa5IAXDow_6zUcW07pDW9ky remax-first
            17vIrDHun9uFRcJRFTdeyu99c_AywMSuz the-station
            1fUb9EJJ6GC2Y_LNQnKVirP2_Oy7OgutL sabre
            17S0I1yf9P-8t5HL5Z7SPqzby8nkRN4K7 yyc-cycle
            16FbiIW4zhlL0CgprObVzuBtw1fp00gY- the-park
            1yf783BjRKsufstd5KeOK7HPn1W3Bh_ui centron
            1MY2GLx-LIFS4hvuZ8xHLBgjCMclxOg-0 rev
            1og06H_we6O7OLW24ZbLBZW6S6WSqEa5a rejuvenation
            1EArItZ_oZ8XgUVQt0op9lldP8MwpUm0b california-tan
            1pVYPBQE32dNlCTYvnSGFOZiDKhm8fisi cranston
            16qwdGDwivjLxnb_TyaliAG9iOwwAlL3f kings-fitness
            1xQXCsA56-vDwvNonaXMOccI_kETo60dX buffalo-bobs
            1jSC1Vu_HNGJQzeJ9Bm8HHElvwlgL3H25 auburn-bay
            1Y8JYvZu3ephXSkveii57HzmW130hvyW_ dental-360
            1RwnOsEPQK2Auh0z8EmwWzBJw7oywyhEc cold-beer-pizza
            1_W8kZeh4LCsBIDiIdMb-gVrWlhoTjl3g mercedes-benz-downtown
            1hlGbd0G1o23IYkqeoPmACbgo0Eb6OIEA porch
            1FTSArphKsqNJOrWs1kdKE7b1plMxbZI6 penny-black
            1vTiV2Txf1mBF-NOcqJETr_X-j2CMJKD1 rockwell
            1ESreWYtCS30OZi831Phw3AU6MSNqTIhj clearview
            1M7wjTUM-w3LmZzICHSIWMvBGTG2lz5G1 golds-gym
            10HwNO60xw1n4OM0GsE9WG8RDyGnPu7Cd toms-pizza
            1qu2nONMqyiDqTS6YdaBYSW38vCp75C5Q mercedes-benz-country-hills
            1ZewDF0BhcjEG6fL26TYRlMJ3mU1CPo1G newcastle
            1Ar8CRDd7rKTlPYDMqwSdILXkDxpYa0F4 kahanoff
            1bsoX6J2yS3B6YevDeU2ATKebxRYDHs6R inhale-exhale
            1n7cfI3jJBORJ4zbS0M12AfhSXqgeLdJU the-realm
